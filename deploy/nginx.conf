# 데이터 시각화 도구 Nginx 예시
# 복사 위치: /etc/nginx/sites-available/visualization-tool
# server_name 과 root 경로를 배포 서버에 맞게 수정한다.

upstream visualization_backend {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name visualization.example.go.kr;

    root /opt/visualization-tool/dist;
    index index.html;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://visualization_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # expires만 사용한다. 이 location에서 add_header를 쓰면 server 보안 헤더가 사라진다.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
    }

    location ~ /\. {
        deny all;
    }
}
